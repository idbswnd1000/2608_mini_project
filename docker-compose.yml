services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: rag_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: